<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>AI Vehicle Recognition</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 960px;
            margin: auto;
            padding: 40px;
            background: white;
            margin-top: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 12px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        form {
            text-align: center;
            margin-bottom: 30px;
        }
        input[type="file"] {
            margin: 10px;
        }
        input[type="submit"] {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .results {
            margin-top: 20px;
        }
        .results h3 {
            color: #444;
        }
        .plate {
            padding: 10px;
            background-color: #e7f5ff;
            border: 1px solid #bee3f8;
            margin: 10px 0;
            border-radius: 6px;
        }
        img {
            max-width: 100%;
            border: 2px solid #007bff;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Vehicle Recognition System</h1>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="image" required>
            <br>
            <input type="submit" value="Upload & Detect">
        </form>

        {% if file_path %}
            <div class="results">
                <h3>Detected License Plates:</h3>
                {% for plate, status in result %}
                    <div class="plate">
                        <strong>{{ plate }}</strong> - <em>{{ status }}</em>
                    </div>
                {% endfor %}
                <h3>Processed Image:</h3>
                <img src="{{ file_path }}" alt="Processed Image with Bounding Boxes">
            </div>
        {% endif %}
    </div>
</body>
</html>
